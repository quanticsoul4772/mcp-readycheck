name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx mcp-use typecheck

      - name: Build
        run: npm run build

      # `test:pure` only. `test:live` POSTs real audits against the deployed
      # server and needs MANUFACT_API_KEY, so it stays out of CI deliberately —
      # see the mistake-log entry in AGENTS.md.
      #
      # Until G5 this job ran typecheck and build and nothing else, which is why
      # G4's staged break sailed through CI green: `fast-checks` never executed a
      # single test. The frozen suite caught that defect locally and the live
      # audit caught it after deploy; CI caught it at no point.

      # Cross-checks discovery against the git index, refuses npm scripts that
      # stop routing through scripts/run-tests.mjs, and checks each file's suite
      # against how it behaves with no key: a file CI runs must pass without one,
      # and a file held out of CI must fail without one AND name the key as what
      # it is missing. That last clause is not decoration — without it a test
      # asserting 1 + 1 === 3 could be named in LIVE and executed by no CI job
      # with the build green, which an evaluation demonstrated. The first draft
      # of this step compared discovery against itself and could never fail.
      - name: Test discovery is complete
        run: npm run test:check

      - name: Test (pure)
        run: npm run test:pure
